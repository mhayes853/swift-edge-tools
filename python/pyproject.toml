[project]
name = "needle"
version = "0.1.0"
description = ""
requires-python = ">=3.9"
dependencies = [
    "torch==2.10.0",
    "coreai-torch==0.4.0",
    "huggingface_hub>=1.21.0",
    "safetensors>=0.6.2",
    "sentencepiece>=0.2.1",
    "tokenizers>=0.22.1",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["needle"]
package-dir = {needle = "needle"}
py-modules = ["cli"]

[project.scripts]
needle-coreai-export = "cli:main"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
explicit_package_bases = true
mypy_path = "."