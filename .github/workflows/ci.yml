---
name: CI

"on":
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  macos:
    name: macOS Tests
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          lfs: true
          persist-credentials: false
          submodules: recursive
      - name: Select Xcode 26.4
        run: sudo xcode-select -s /Applications/Xcode_26.4.app
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - name: Install Python exporter
        run: |
          python3 -m venv python/.venv
          python/.venv/bin/python -m pip install -e python
      - name: Run tests
        env:
          NEEDLE_INFERENCE_TESTS: basic
        run: >
          swift test --disable-experimental-prebuilts --enable-all-traits

  python-macos:
    name: macOS Python Tests
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          submodules: recursive
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - name: Install Python package
        run: python3 -m pip install -e .
        working-directory: python
      - name: Run Python test suite
        run: python3 -m unittest
        working-directory: python

  linux:
    name: Linux Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          lfs: true
          persist-credentials: false
          submodules: recursive
      - name: Run tests
        run: >
          scripts/test-linux.sh --traits ONNX --all-tests --python-venv

  android:
    name: Android Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          lfs: true
          persist-credentials: false
          submodules: recursive
      - name: Build Swift package for Android
        uses: "swift-android-sdk/swift-android-action@\
          2044b79660f201ccef8cbce62877e4ec5409f9c8"
        with:
          swift-version: 6.3
          swift-build-flags: >
            --disable-experimental-prebuilts
            --disable-default-traits
            --traits ONNX
          build-tests: false
          run-tests: false

  windows:
    name: Windows ONNXCore Build
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          lfs: true
          persist-credentials: false
          submodules: recursive
      - name: Set up Swift 6.3
        uses: "compnerd/gha-setup-swift@\
          eeda069c5bc95ac8a9ac5cea7d4f588ae5420ca5"
        with:
          swift-version: swift-6.3-release
          swift-build: 6.3-RELEASE
      - name: Build Swift package
        run: >
          swift build --disable-experimental-prebuilts
          --disable-default-traits --traits ONNXCore

  wasm-export:
    name: WebAssembly Needle Export
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          lfs: true
          persist-credentials: false
          submodules: recursive
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - name: Install Python exporter
        run: |
          python3 -m venv python/.venv
          python/.venv/bin/python -m pip install -e python
      - name: Export Needle ONNX model
        run: |
          python/.venv/bin/python python/cli.py \
            --backend onnx \
            --onnx-quantization int4 \
            --output .edge-tools-tests/onnx-export-v2-float32-int4
      - name: Upload Needle ONNX model
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wasm-needle-onnx-model
          path: .edge-tools-tests/onnx-export-v2-float32-int4
          include-hidden-files: true
          retention-days: 1
          compression-level: 0

  wasm:
    name: WebAssembly Tests (${{ matrix.onnx-package }})
    needs: wasm-export
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        onnx-package:
          - onnxruntime-node
          - onnxruntime-web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          lfs: true
          persist-credentials: false
          submodules: recursive
      - name: Download Needle ONNX model
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: wasm-needle-onnx-model
          path: .edge-tools-tests/onnx-export-v2-float32-int4
      - name: Install Swift 6.3.2
        uses: "swift-actions/setup-swift@\
          364295d9c23900ce04d4e5cc708387921b4e50f9"
        with:
          swift-version: "6.3.2"
          skip-verify-signature: true
      - name: Install Swift SDK for WebAssembly
        run: |
          set -ex
          sdk_url="https://download.swift.org/swift-6.3.2-release/wasm-sdk/"
          sdk_url+="swift-6.3.2-RELEASE/"
          sdk_url+="swift-6.3.2-RELEASE_wasm.artifactbundle.tar.gz"
          checksum="a61f0584c93283589f8b2f42db05c1f9"
          checksum+="a182b506c2957271402992655591dd7c"
          swift sdk install "$sdk_url" --checksum "$checksum"
      - name: Run JavaScriptKit tests
        run: scripts/test-wasm.sh --onnx-package "${{ matrix.onnx-package }}"
