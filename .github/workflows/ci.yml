---
name: CI

"on":
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    name: Linux Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: swift:6.3.2-jammy
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          submodules: recursive
      # Needle 2 links libc++, which the Swift image does not ship, and its static libraries call
      # `std::__1::__hash_memory`, which only libc++ 21 and newer export. The JavaScript target's
      # BridgeJS plugin also shells out to Node even when the JS trait is disabled.
      - name: Install build dependencies
        run: |
          set -euo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl gnupg
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key \
            | gpg --dearmor -o /usr/share/keyrings/llvm.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm.gpg]" \
            "http://apt.llvm.org/jammy/ llvm-toolchain-jammy-21 main" \
            > /etc/apt/sources.list.d/llvm.list
          curl -fsSL https://deb.nodesource.com/setup_22.x -o /tmp/nodesource.sh
          bash /tmp/nodesource.sh
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            libc++-21-dev libc++abi-21-dev nodejs
          echo "LIBRARY_PATH=/usr/lib/llvm-21/lib" >> "$GITHUB_ENV"
      - name: Test Swift package
        run: >
          swift test --disable-experimental-prebuilts
          --traits Foundation,FoundationEssentials,XGrammar,Needle2,ChatTemplates,HuggingFaceTokenizers,FoundationModels,Llama
          --skip 'Model tests'

  windows:
    name: Windows Tests
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          submodules: recursive
      - name: Set up Swift 6.3
        uses: "compnerd/gha-setup-swift@\
          eeda069c5bc95ac8a9ac5cea7d4f588ae5420ca5"
        with:
          swift-version: swift-6.3-release
          swift-build: 6.3-RELEASE
      # PowerShell splits a bare comma-separated token into separate arguments.
      - name: Test Swift package
        run: >
          swift test --disable-experimental-prebuilts
          --traits "Foundation,FoundationEssentials,XGrammar,Needle2,ChatTemplates,FoundationModels"

  android:
    name: Android Build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          submodules: recursive
      # Building the suites needs test discovery, which reads an index store that the cross build
      # leaves incomplete, so Android stays a build-only job.
      - name: Build Swift package for Android
        uses: "swift-android-sdk/swift-android-action@\
          2044b79660f201ccef8cbce62877e4ec5409f9c8"
        with:
          swift-version: "6.3"
          swift-build-flags: >-
            --disable-experimental-prebuilts
            --force-resolved-versions
            --traits Foundation,FoundationEssentials,XGrammar,Needle2,ChatTemplates,HuggingFaceTokenizers,FoundationModels
          build-tests: false
          run-tests: false
          free-disk-space: true

  wasm:
    name: WASM Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: swift:6.3.2-jammy
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          submodules: recursive
      # The JS trait's BridgeJS plugin shells out to Node during the build.
      - name: Install build dependencies
        run: |
          set -euo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl git-lfs gnupg
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git lfs pull --include="ts/needle2/assets/*"
          curl -fsSL https://deb.nodesource.com/setup_22.x -o /tmp/nodesource.sh
          bash /tmp/nodesource.sh
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends nodejs
      - name: Install the WebAssembly Swift SDK
        run: >
          swift sdk install
          "https://download.swift.org/swift-6.3.2-release/wasm-sdk/swift-6.3.2-RELEASE/swift-6.3.2-RELEASE_wasm.artifactbundle.tar.gz"
          --checksum a61f0584c93283589f8b2f42db05c1f9a182b506c2957271402992655591dd7c
      - name: Test Swift package
        run: scripts/test-wasm.sh

  macos_changes:
    name: Detect macOS engine changes
    runs-on: ubuntu-latest
    outputs:
      llama: ${{ steps.filter.outputs.llama }}
      mlx: ${{ steps.filter.outputs.mlx }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive
      - name: Detect changed engine paths
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PULL_REQUEST_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_sha="$PULL_REQUEST_BASE_SHA"
            head_sha="$PULL_REQUEST_HEAD_SHA"
          else
            base_sha="$BEFORE_SHA"
            head_sha="$AFTER_SHA"
          fi

          if [[ "$base_sha" =~ ^0+$ ]]; then
            changed_files="$(git ls-tree -r --name-only "$head_sha")"
          else
            changed_files="$(git diff --name-only "$base_sha" "$head_sha")"
          fi

          llama=false
          mlx=false
          while IFS= read -r path; do
            case "$path" in
              .github/workflows/ci.yml \
              | Package.swift \
              | Package.resolved \
              | swift/EdgeTools/Sources/EdgeTools/EdgeTools*.swift \
              | swift/EdgeTools/Sources/EdgeTools/Engines/EdgeTools*.swift \
              | swift/EdgeTools/Sources/EdgeTools/Models/* \
              | swift/EdgeTools/Tests/EdgeToolsTests/Models/* \
              | swift/EdgeTools/Tests/EdgeToolsTests/Internal/GenerationTestSupport.swift \
              | swift/EdgeTools/Tests/EdgeToolsTests/Internal/ModelDownloading.swift \
              | swift/EdgeTools/Tests/EdgeToolsTests/Internal/MultimodalTestTrait.swift \
              | swift/EdgeTools/Tests/EdgeToolsTests/Internal/SharedTools.swift \
              | swift/EdgeTools/Tests/EdgeToolsTests/Internal/TranscriptContextTestSupport.swift \
              | swift/EdgeTools/Plugins/PatchPlugin/plugin.swift)
                llama=true
                mlx=true
                ;;
              swift/EdgeTools/Sources/EdgeTools/Engines/Llama/* \
              | swift/EdgeTools/Sources/EdgeToolsLlama/* \
              | swift/EdgeTools/Sources/EdgeToolsTokenizers/Llama* \
              | swift/EdgeTools/Tests/EdgeToolsTests/Engines/Llama* \
              | swift/EdgeTools/Tests/EdgeToolsTests/Internal/Llama* \
              | swift/EdgeTools/Tests/EdgeToolsLlamaTests/* \
              | patches/Llama/* \
              | scripts/llama/*)
                llama=true
                ;;
              swift/EdgeTools/Sources/EdgeTools/Engines/MLX/* \
              | swift/EdgeTools/Tests/EdgeToolsTests/Engines/MLX* \
              | swift/EdgeTools/Tests/EdgeToolsTests/Internal/MLX* \
              | swift/EdgeTools/Tests/EdgeToolsTests/MLX* \
              | swift/EdgeTools/Tests/EdgeToolsTests/Grammar/GrammarBitmaskTests.swift \
              | scripts/test-mlx.sh \
              | scripts/mlx-metallib.sh)
                mlx=true
                ;;
            esac
          done <<< "$changed_files"

          echo "llama=$llama" >> "$GITHUB_OUTPUT"
          echo "mlx=$mlx" >> "$GITHUB_OUTPUT"

  macos_general:
    name: macOS General Tests
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          submodules: recursive
      - name: Select Xcode 26.4
        run: sudo xcode-select -s /Applications/Xcode_26.4.app
      - name: Test Swift package
        run: >
          swift test --disable-experimental-prebuilts
          --traits Foundation,FoundationEssentials,XGrammar,Needle2,ChatTemplates,HuggingFaceTokenizers,FoundationModels,Llama
          --skip 'Model tests'
      - name: Test CLI package
        working-directory: swift/CLI
        run: |
          set -euo pipefail
          swift build --disable-experimental-prebuilts
          metal_library="$(../../scripts/mlx-metallib.sh .)"
          ln -s "$metal_library" default.metallib
          trap 'unlink default.metallib' EXIT
          swift test --disable-experimental-prebuilts

  macos_llama:
    name: macOS Llama Inference
    if: needs.macos_changes.outputs.llama == 'true'
    needs: macos_changes
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          submodules: recursive
      - name: Select Xcode 26.4
        run: sudo xcode-select -s /Applications/Xcode_26.4.app
      # The runner's GPU is paravirtual and reports no simdgroup matrix multiply, so llama.cpp
      # falls back to scalar Metal kernels and a single snapshot can decode for half an hour. Its
      # vision path segfaults outright. Pinning the engine to the CPU picks up the NEON repack
      # kernels instead, and the suite stays on the GPU everywhere else.
      - name: Smoke test llama inference
        env:
          EDGE_TOOLS_DISABLE_LLAMA_GPU: "1"
        run: >
          swift test --disable-experimental-prebuilts
          --traits Foundation,FoundationEssentials,XGrammar,Needle2,ChatTemplates,HuggingFaceTokenizers,FoundationModels,Llama
          --filter 'LlamaEngine tests|LlamaTokenizer tests|FunctionGemma tests'

  macos_mlx:
    name: macOS MLX Inference
    if: needs.macos_changes.outputs.mlx == 'true'
    needs: macos_changes
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          submodules: recursive
      - name: Select Xcode 26.4
        run: sudo xcode-select -s /Applications/Xcode_26.4.app
      - name: Test MLX inference
        run: scripts/test-mlx.sh

  macos:
    name: macOS Tests
    if: always()
    needs: [macos_changes, macos_general, macos_llama, macos_mlx]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if a macOS check failed
        if: >-
          needs.macos_changes.result != 'success' ||
          needs.macos_general.result != 'success' ||
          needs.macos_llama.result == 'failure' ||
          needs.macos_llama.result == 'cancelled' ||
          needs.macos_mlx.result == 'failure' ||
          needs.macos_mlx.result == 'cancelled'
        run: |
          echo "A macOS check failed."
          exit 1

  embedded:
    name: Embedded Swift Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          submodules: recursive
      - name: Resolve development snapshot
        id: snapshot
        run: |
          set -euo pipefail
          tag="$(scripts/smoke-embedded.sh --print-snapshot)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Resolved $tag."
      - name: Install Swift development snapshot
        uses: SwiftyLab/setup-swift@76e3e48ac9c85b393a30adefd96afe0395b23c29
        with:
          swift-version: ${{ steps.snapshot.outputs.tag }}
          cache-snapshot: false
          check-latest: true
      - name: Cache Swift SDKs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.config/swiftpm/swift-sdks
          key: swift-sdks-${{ runner.os }}-${{ steps.snapshot.outputs.tag }}
      - name: Cache build directories
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: swift/EmbeddedSmoke/.build
          key: >-
            spm-embedded-v2-${{ runner.os }}-${{ steps.snapshot.outputs.tag }}-${{
            hashFiles('Package.resolved',
            'swift/EmbeddedSmoke/Package.resolved') }}
          restore-keys: |
            spm-embedded-v2-${{ runner.os }}-${{ steps.snapshot.outputs.tag }}-
      - name: Run the embedded smoke test
        env:
          EMBEDDED_SWIFT_SNAPSHOT: ${{ steps.snapshot.outputs.tag }}
        run: scripts/smoke-embedded.sh
