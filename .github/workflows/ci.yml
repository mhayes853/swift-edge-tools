---
name: CI

"on":
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  swift-platforms:
    name: Swift Platforms
    uses: "swiftlang/github-workflows/.github/workflows/\
      swift_package_test.yml@9a10bfdc569159a3463f1273fbd7ed5f97fbe598"
    with:
      enable_macos_checks: false
      enable_windows_docker: false

      enable_linux_checks: true
      linux_swift_versions: '["6.3"]'
      linux_os_versions: '["jammy"]'
      linux_host_archs: '["x86_64"]'
      linux_pre_build_command: >-
        git config --global --add safe.directory '*' &&
        git submodule update --init --recursive
      linux_build_command: >-
        apt-get update &&
        DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends
        curl ca-certificates gnupg libc++-dev libc++abi-dev &&
        curl -fsSL https://deb.nodesource.com/setup_22.x -o /tmp/nodesource.sh &&
        bash /tmp/nodesource.sh &&
        DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends nodejs &&
        export LIBRARY_PATH="$(dirname "$(find /usr/lib/llvm-* -name libc++.so
        -print -quit)")${LIBRARY_PATH:+:$LIBRARY_PATH}" &&
        swift build --disable-experimental-prebuilts
        --traits Foundation,FoundationEssentials,XGrammar,Needle2,ChatTemplates,HuggingFaceTokenizers,FoundationModels,Llama

      enable_windows_checks: true
      windows_swift_versions: '["6.3"]'
      windows_os_versions: '["windows-2022"]'
      windows_pre_build_command: >-
        Invoke-Program git config --global --add safe.directory '*';
        Invoke-Program git submodule update --init --recursive
      windows_build_command: >-
        Invoke-Program swift build --disable-experimental-prebuilts
        --traits "Foundation,FoundationEssentials,XGrammar,Needle2,ChatTemplates,HuggingFaceTokenizers,FoundationModels"

      enable_android_sdk_build: true
      enable_android_sdk_checks: false
      android_sdk_versions: '["6.3"]'
      android_ndk_versions: '["r27d"]'
      android_sdk_triples: '["aarch64-unknown-linux-android28"]'
      android_sdk_build_command: >-
        swift build --disable-experimental-prebuilts
        --traits Foundation,FoundationEssentials,XGrammar,Needle2,ChatTemplates,HuggingFaceTokenizers,FoundationModels

      enable_wasm_sdk_build: true
      wasm_sdk_versions: '["6.3"]'
      wasm_sdk_pre_build_command: >-
        apt-get update &&
        DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends
        curl ca-certificates gnupg &&
        curl -fsSL https://deb.nodesource.com/setup_22.x -o /tmp/nodesource.sh &&
        bash /tmp/nodesource.sh &&
        DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends nodejs
      wasm_sdk_build_command: >-
        swift build --disable-experimental-prebuilts --traits Needle2,JS

  macos:
    name: macOS Build
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          submodules: recursive
      - name: Select Xcode 26.4
        run: sudo xcode-select -s /Applications/Xcode_26.4.app
      - name: Build Swift package
        run: >
          swift build --disable-experimental-prebuilts
          --traits Foundation,FoundationEssentials,XGrammar,Needle2,ChatTemplates,HuggingFaceTokenizers,FoundationModels,MLX,Llama

  embedded:
    name: Embedded Swift Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          submodules: recursive
      - name: Resolve development snapshot
        id: snapshot
        run: |
          set -euo pipefail
          tag="$(scripts/smoke-embedded.sh --print-snapshot)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Resolved $tag."
      - name: Install Swift development snapshot
        uses: SwiftyLab/setup-swift@76e3e48ac9c85b393a30adefd96afe0395b23c29
        with:
          swift-version: ${{ steps.snapshot.outputs.tag }}
          cache-snapshot: false
      - name: Cache Swift SDKs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.config/swiftpm/swift-sdks
          key: swift-sdks-${{ runner.os }}-${{ steps.snapshot.outputs.tag }}
      - name: Cache build directories
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: swift/EmbeddedSmoke/.build
          key: >-
            spm-embedded-v2-${{ runner.os }}-${{ steps.snapshot.outputs.tag }}-${{
            hashFiles('Package.resolved',
            'swift/EmbeddedSmoke/Package.resolved') }}
          restore-keys: |
            spm-embedded-v2-${{ runner.os }}-${{ steps.snapshot.outputs.tag }}-
      - name: Run the embedded smoke test
        env:
          EMBEDDED_SWIFT_SNAPSHOT: ${{ steps.snapshot.outputs.tag }}
        run: scripts/smoke-embedded.sh
