  python-macos:
    name: Python Tests (macOS)
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - name: Install Python package
        run: python3 -m pip install -e .
        working-directory: python
      - name: Run Python test suite
        run: python3 -m unittest
        working-directory: python

  linux-onnx:
    name: Linux ONNX
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608
        with:
          lfs: true
          persist-credentials: false
          submodules: recursive
      - name: Build ONNXCore without an ONNX Runtime library
        run: scripts/test-linux.sh --traits ONNXCore --build-only
      - name: Test generic, vendored, and Swift System ONNX Runtime APIs
        run: >
          scripts/test-linux.sh --traits ONNX,System
          --filter 'CONNXRuntime tests|EdgeToolsONNXRuntime tests'

  # android:
  #   name: Android
