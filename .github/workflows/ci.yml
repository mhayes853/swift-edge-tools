name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS
    runs-on: macos-26
    strategy:
      matrix:
        xcode: ["26.4"]
        config: ["debug", "release"]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Select Xcode ${{ matrix.xcode }}
        run: sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode }}.app
      - name: Run ${{ matrix.config }} tests
        run: swift test --configuration ${{ matrix.config }} --disable-experimental-prebuilts --enable-all-traits

  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: "Test Swift Package on Linux"
        run: swift test --disable-experimental-prebuilts --traits XGrammar,Sentencepiece

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: "Test Swift Package on Android"
        uses: swift-android-sdk/swift-android-action@v2
        with:
          swift-version: 6.3
          swift-build-flags: --disable-experimental-prebuilts --traits XGrammar,Sentencepiece
          run-tests: false # NB: Emulator seems to take too long to boot

  wasm:
    name: Wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Swift 6.3.0
        uses: swift-actions/setup-swift@v3
        with:
          swift-version: "6.3"
          skip-verify-signature: true
      - uses: bytecodealliance/actions/wasmtime/setup@v1
      - name: Install Swift SDK for WebAssembly
        run: |
          set -ex
          swift sdk install https://github.com/swiftwasm/swift/releases/download/swift-wasm-6.3-RELEASE/swift-wasm-6.3-RELEASE-wasm32-unknown-wasip1-threads.artifactbundle.zip --checksum a09a0eed0fef420b4b8bb03e4dc0e7e2653ab6c88b44cb4f359ef06063b35c39
      - name: Build Swift Package for WebAssembly
        run: swift build --swift-sdk swift-6.3-RELEASE_wasm --target Needle -Xlinker -z -Xlinker stack-size=$((1024 * 1024)) --traits XGrammar,Sentencepiece

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: "Setup Swift on Windows"
        uses: compnerd/gha-setup-swift@main
        with:
          branch: swift-6.3-release
          tag: 6.3-RELEASE
      - name: "Test Swift Package on Windows"
        run: swift test --disable-experimental-prebuilts --traits XGrammar,Sentencepiece
