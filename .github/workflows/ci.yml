  wasm:
    name: WebAssembly
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Swift 6.3.2
        uses: swift-actions/setup-swift@v3
        with:
          swift-version: "6.3.2"
          skip-verify-signature: true
      - name: Install Swift SDK for WebAssembly
        run: |
          set -ex
          sdk_url="https://download.swift.org/swift-6.3.2-release/wasm-sdk/"
          sdk_url+="swift-6.3.2-RELEASE/"
          sdk_url+="swift-6.3.2-RELEASE_wasm.artifactbundle.tar.gz"
          checksum="a61f0584c93283589f8b2f42db05c1f9"
          checksum+="a182b506c2957271402992655591dd7c"
          swift sdk install "$sdk_url" --checksum "$checksum"
      - name: Build Main Test Suite For WebAssembly
        run: >
          swift build --swift-sdk swift-6.3.2-RELEASE_wasm
          --disable-default-traits --traits Foundation,XGrammar,System,Atomics
          --disable-experimental-prebuilts --target EdgeToolsTests
      - name: Test Foundation-Free EdgeTools With XGrammar, System, And Atomics
        working-directory: swift/WASITests
        run: >
          swift test --swift-sdk swift-6.3.2-RELEASE_wasm
          --disable-xctest --disable-experimental-prebuilts

